<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#17171A">
<link rel="manifest" href="manifest.json">
<title>vidrag</title>
<style>
/* Editorial Terminal re-skin (2026-07-14, direction B): warm graphite,
   New York serif for titles, SF Mono for metadata, hairlines over shadows.
   All class names / app-shell behavior preserved from the previous skin. */
:root{
  --bg:#17171A; --surface:#1F1F22; --surface2:#27272A; --overlay:#303033;
  --line:rgba(240,238,230,.1); --line-strong:rgba(240,238,230,.18);
  --text:rgba(240,238,230,.94); --muted:rgba(240,238,230,.58);
  --accent:#D9B26A;           /* amber: highlight / selected / primary action */
  --action:#8DBBFF;           /* blue: links / secondary interactive */
  --ok:#4FB286; --warn:#D9B26A; --err:#D98A90; --radius:6px;
  --serif:"New York",ui-serif,Georgia,"PingFang TC","Noto Sans TC",serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box} html,body{margin:0}
html{height:100%}
body{
  /* App-shell layout: the page never scrolls — <main> scrolls internally,
     so the tab bar can live in normal flow (no iOS position:fixed quirks). */
  height:100vh; height:100dvh; overflow:hidden;
  display:flex; flex-direction:column;
  background:var(--bg); color:var(--text);
  font:16px/1.65 -apple-system,"PingFang TC","Noto Sans TC",sans-serif;
  -webkit-tap-highlight-color:transparent;
}
.serif{font-family:var(--serif)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
main{
  flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
  padding:14px 16px 28px; max-width:760px; margin:0 auto; width:100%;
}
/* bottom dock: chat input (when on chat tab) + tab bar, always visible */
#dock:empty{display:none}
#dock{background:var(--bg); border-top:1px solid var(--line);
  padding:8px 12px; max-width:760px; margin:0 auto; width:100%}
#dock .row{gap:8px}
nav{
  flex-shrink:0; display:flex;
  background:var(--bg); border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
#dock:not(:empty) + nav{border-top:none}
nav button{flex:1;background:none;border:none;color:var(--muted);padding:13px 0 11px;
  font-size:13px;letter-spacing:.14em;cursor:pointer;transition:color .15s;
  position:relative}
nav button.active{color:var(--text)}
nav button.active::after{content:"";position:absolute;left:50%;bottom:7px;
  transform:translateX(-50%);width:22px;height:2px;background:var(--accent)}
nav button .ico{display:none}

h2{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--muted);
  letter-spacing:.16em;margin:22px 4px 8px;text-transform:uppercase}
.card{background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius);padding:14px;margin:8px 0}
.card.p2{background:var(--surface2)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
button.btn{background:transparent;color:var(--accent);
  border:1px solid rgba(217,178,106,.55);border-radius:var(--radius);
  padding:9px 15px;font-size:14px;font-weight:600;cursor:pointer;
  transition:opacity .15s,background .15s}
button.btn:active{background:rgba(217,178,106,.14)}
button.btn:disabled{opacity:.45}
button.btn.ghost{color:var(--muted);border-color:var(--line-strong)}
button.btn.danger{color:var(--err);border-color:rgba(217,138,144,.5)}
/* 字級必須 ≥16px:iOS Safari 對 <16px 的輸入框會在聚焦時自動放大整頁,
   且失焦後不會縮回(回饋 2026-07-17:新增/搜尋框觸發) */
input,textarea,select{background:transparent;border:1px solid var(--line-strong);
  color:var(--text);border-radius:var(--radius);padding:9px 12px;font-size:16px;
  width:100%;outline:none}
input:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:70px;background:var(--surface)}
.muted{color:var(--muted);font-size:13px}
.badge{display:inline-block;padding:2px 8px;border-radius:3px;font-size:10.5px;
  font-weight:700;font-family:var(--mono);letter-spacing:.08em;
  border:1px solid currentColor}
.badge.ok{color:var(--ok)}
.badge.warn{color:var(--warn)}
.badge.err{color:var(--err)}
.badge.info{color:var(--action)}
/* collapsible admin groups (ledger style) */
details.group{background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius);margin:8px 0;overflow:hidden}
details.group>summary{list-style:none;cursor:pointer;padding:13px 14px;
  font-size:15px;font-weight:600;display:flex;align-items:center;gap:10px;
  font-family:var(--serif);user-select:none;-webkit-user-select:none}
details.group>summary::-webkit-details-marker{display:none}
details.group>summary::after{content:"›";margin-left:auto;color:var(--muted);
  font-size:20px;transition:transform .18s;line-height:1}
details.group[open]>summary::after{transform:rotate(90deg)}
details.group>summary .g-ico{font-size:16px;filter:grayscale(1) brightness(1.3)}
details.group>summary .g-hint{margin-left:auto;padding-right:6px;
  font-family:var(--mono);font-size:11px;letter-spacing:.05em}
details.group>summary .g-hint+*{margin-left:0}
details.group .card{border:none;border-radius:0;margin:0;
  border-top:1px solid var(--line);background:transparent}
.card h3{margin:0 0 8px;font-size:15px;color:var(--text);font-family:var(--serif)}
/* 管理主頁的「進階設定」入口列(外觀同 group summary) */
.glink{background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius);margin:8px 0;padding:13px 14px;cursor:pointer;
  font-size:15px;font-weight:600;font-family:var(--serif);
  display:flex;align-items:center;gap:10px;user-select:none;-webkit-user-select:none}
.glink::after{content:"›";margin-left:6px;color:var(--muted);font-size:20px;line-height:1}
.glink .g-hint{margin-left:auto;font-family:var(--mono);font-size:11px;
  letter-spacing:.05em}
.glink:focus-visible{outline:1px solid var(--accent);outline-offset:2px}
/* 進階設定:兩行式 summary(標題+一句話說明常駐) */
.g-2l{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.g-desc{font-size:12px;color:var(--muted);font-weight:400;
  font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif;line-height:1.5}
.page-title{font-family:var(--serif);font-size:20px;font-weight:700;
  color:var(--text);text-transform:none;letter-spacing:0;margin:10px 2px}
/* masthead: page header line with mono status on the right */
.masthead{display:flex;align-items:baseline;gap:10px;
  border-bottom:1px solid var(--line);padding:2px 2px 10px;margin-bottom:4px}
.masthead .mt{font-family:var(--serif);font-size:20px;font-weight:700}
.masthead .md-r{margin-left:auto;font-family:var(--mono);font-size:10.5px;
  color:var(--muted);letter-spacing:.08em}
/* status lights */
.light{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;
  vertical-align:1px}
.light.g{background:var(--ok)}
.light.y{background:var(--warn)}
.light.r{background:var(--err)}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-top:4px;
  border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.statgrid .stat{background:transparent;border-radius:0;padding:11px 8px;
  text-align:center}
.statgrid .stat+.stat{border-left:1px solid var(--line)}
.statgrid .stat .v{font-family:var(--mono);font-size:14px;font-weight:600;
  display:block;margin-top:3px;font-variant-numeric:tabular-nums}
.statgrid .stat .k{font-size:11px;color:var(--muted)}
/* inline progress spinner for processing/queued badges */
.spin{display:inline-block;width:9px;height:9px;margin-right:5px;
  border:1.5px solid currentColor;border-right-color:transparent;border-radius:50%;
  animation:spin .8s linear infinite;vertical-align:-1px}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation:none}}
/* chat — document style, not bubbles */
#chat-log{display:flex;flex-direction:column;gap:16px;margin-bottom:10px}
.msg{max-width:100%;white-space:pre-wrap;word-break:break-word}
.msg.user{align-self:stretch;background:none;border-left:3px solid var(--accent);
  padding:2px 0 2px 12px;font-weight:600;font-size:15px}
.msg.ai{align-self:stretch;background:none;border:none;padding:0 2px;
  font-size:15px;line-height:1.78}
.msg.ai .v-btn{margin-top:10px}
/* citations: numbered hairline rows */
.cite{display:flex;gap:11px;align-items:center;background:none;
  border-top:1px solid var(--line);border-radius:0;padding:10px 2px;margin-top:0;
  text-decoration:none;color:var(--text);font-size:13px;cursor:pointer}
.cite:first-of-type{margin-top:12px}
.cite .n{font-family:var(--mono);font-size:10px;color:var(--muted);
  width:14px;flex-shrink:0}
.cite .t{color:var(--text);font-family:var(--serif);font-weight:600}
.cite .d{color:var(--accent);font-weight:600}
.cite .cm{font-family:var(--mono);font-size:11px;color:var(--muted);
  font-variant-numeric:tabular-nums}
.cite-thumb{width:52px;height:40px;object-fit:cover;border-radius:4px;flex-shrink:0}
.cite-body{min-width:0}
/* citation context window (點引用 → 展開上下文) */
.ctx{font-size:14px;line-height:1.75;color:var(--muted);margin:10px 0}
.ctx.hit{color:var(--text);background:rgba(217,178,106,.1);
  border-left:3px solid var(--accent);padding:8px 12px;border-radius:0}
/* retrieval trace: 「這則回答的依據」(gap-3) — collapsed by default */
.trace{margin-top:12px;border-top:1px solid var(--line)}
.trace>summary{list-style:none;cursor:pointer;padding:9px 2px;font-size:12px;
  font-family:var(--mono);color:var(--muted);letter-spacing:.03em}
.trace>summary::-webkit-details-marker{display:none}
.trace>summary::before{content:"▸ ";opacity:.7}
.trace[open]>summary::before{content:"▾ "}
.trace-list{padding:2px 0 6px}
.trace-row{display:flex;gap:9px;align-items:baseline;padding:7px 2px;
  font-size:12px;cursor:pointer;border-top:1px solid var(--line)}
.trace-row .tn{font-family:var(--mono);font-size:10px;color:var(--muted);
  width:22px;flex-shrink:0}
.trace-row .tt{color:var(--text);flex:1;min-width:0;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.trace-row .tp{font-family:var(--mono);font-size:10.5px;color:var(--muted);
  flex-shrink:0;font-variant-numeric:tabular-nums}
.trace-row .tc{font-size:10px;color:var(--accent);flex-shrink:0}
.trace-row.cited .tt{color:var(--text);font-weight:600}
#dock #c-q{border-radius:var(--radius);padding:10px 14px}
#dock .btn{border-radius:var(--radius)}
.dock-scope{margin-bottom:8px}
.scopebtn{background:transparent;border:1px solid var(--line-strong);
  color:var(--muted);border-radius:var(--radius);padding:6px 12px;font-size:12px;
  font-family:var(--mono);cursor:pointer;letter-spacing:.04em}
.scopebtn.on{color:var(--accent);border-color:rgba(217,178,106,.5)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chips button{background:transparent;border:1px solid var(--line-strong);
  color:var(--muted);border-radius:var(--radius);padding:7px 13px;font-size:13px;
  cursor:pointer;text-align:left}
.chips.sugg{margin:12px 0 0}
.chips.sugg button{color:var(--action);border-color:rgba(141,187,255,.35)}
.chips.sugg button::before{content:"↳ ";opacity:.7}
.skeleton{color:var(--muted);font-style:italic}
/* rendered markdown in AI answers */
.msg.ai .md{white-space:normal}
.md>*:first-child{margin-top:0}.md>*:last-child{margin-bottom:0}
.md p{margin:0 0 10px}
.md h1,.md h2,.md h3,.md h4,.md h5,.md h6{margin:14px 0 6px;font-size:15px;
  line-height:1.45;color:var(--text);text-transform:none;letter-spacing:0;
  font-family:var(--serif)}
.md h1{font-size:18px}.md h2{font-size:16px}
.md ul,.md ol{margin:6px 0;padding-left:22px}
.md li{margin:4px 0}
.md blockquote{margin:8px 0;padding:6px 12px;border-left:3px solid var(--accent);
  color:var(--muted);background:none;border-radius:0}
.md code{background:var(--surface2);padding:1px 5px;border-radius:3px;font-size:13px;
  font-family:var(--mono)}
.md pre{background:var(--surface);border:1px solid var(--line);padding:10px;
  border-radius:var(--radius);overflow-x:auto;margin:8px 0}
.md pre code{background:none;padding:0}
.md hr{border:none;border-top:1px solid var(--line);margin:12px 0}
.md a{color:var(--action)}
.md strong{color:var(--text)}
/* library — 研究誌 feed: side column + hairline entries */
/* 以文字入庫:前三行預覽(2026-07-17 批次,防貼錯內容) */
.tpreview{background:var(--surface2);border-left:3px solid var(--accent);
  padding:8px 12px;margin:8px 0;font-size:13px;line-height:1.6;
  color:var(--muted);max-height:110px;overflow:hidden}
/* 方案 A 工具列(2026-07-16):套用中篩選顯示為可點擊清除的 chip */
.tools{margin:2px 0 0}
.fchip{background:transparent;border:1px solid rgba(217,178,106,.5);
  color:var(--accent);border-radius:3px;padding:6px 10px;font-size:11px;
  font-family:var(--mono);letter-spacing:.06em;cursor:pointer;
  max-width:46vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.filters{display:flex;gap:8px;margin:10px 2px 2px;overflow-x:auto}
.filters button{background:transparent;border:1px solid var(--line-strong);
  color:var(--muted);border-radius:3px;padding:5px 12px;font-size:11px;
  font-family:var(--mono);letter-spacing:.12em;cursor:pointer;flex-shrink:0}
.filters button.on{color:var(--accent);border-color:rgba(217,178,106,.5)}
.feed-h{margin:20px 4px 4px}
.vwrap{position:relative;overflow:hidden;border-radius:0;margin:0}
.swipe-del{position:absolute;top:0;right:0;bottom:0;width:80px;border:none;
  background:var(--err);color:#2a1214;font-size:14px;font-weight:700;cursor:pointer;
  border-radius:0}
.vwrap .vcard{position:relative;z-index:1;margin:0;background:var(--bg)}
.vcard{display:flex;gap:12px;border:none;border-bottom:1px solid var(--line);
  border-radius:0;padding:13px 2px}
.vcard .side{width:50px;flex-shrink:0;text-align:right;font-family:var(--mono);
  font-size:10px;color:var(--muted);line-height:1.8;padding-top:3px;
  font-variant-numeric:tabular-nums}
.vcard .side .k{color:var(--accent)}
.vcard .meta{flex:1;min-width:0}
.thumb{width:78px;height:50px;object-fit:cover;border-radius:4px;flex-shrink:0;
  background:var(--surface2)}
/* 無縮圖=線條圖示磁磚(2026-07-14 回饋:每個來源都要圖示,不用 emoji) */
.thumb-fallback{width:78px;height:50px;display:flex;align-items:center;
  justify-content:center;color:var(--muted);border:1px solid var(--line);
  border-radius:4px;background:var(--surface);flex-shrink:0}
.cite-thumb.thumb-fallback{width:52px;height:40px}
.picon{color:var(--muted);vertical-align:-2px}
.vcard .side .picon{margin:3px 0 1px}
/* modal 選單細列表(範圍/歷史對話):取代整版大按鈕 */
.pick-row{display:flex;gap:10px;align-items:center;padding:11px 4px;
  border-top:1px solid var(--line);cursor:pointer;font-size:14px}
.pick-row:first-of-type{border-top:none}
.pick-row .pt{min-width:0;overflow:hidden;text-overflow:ellipsis;line-height:1.5}
.pick-row.on .pt{color:var(--accent);font-weight:600}
.pick-row:focus-visible{outline:1px solid var(--accent);outline-offset:2px}
/* 列尾刪除小叉叉(歷史對話) */
.row-del{margin-left:auto;flex-shrink:0;background:none;border:none;
  color:var(--muted);font-size:13px;cursor:pointer;padding:6px 8px;
  border-radius:3px;line-height:1}
.row-del:hover,.row-del:focus-visible{color:var(--err);background:var(--surface2)}
.thumbrow{display:flex;gap:8px;align-items:center;margin-top:8px}
.vcard .title{font-family:var(--serif);font-weight:600;font-size:15.5px;
  line-height:1.5;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;
  -webkit-line-clamp:2;-webkit-box-orient:vertical}
.vcard .summary{font-size:12.5px;color:var(--muted);white-space:pre-line;
  margin-top:5px;line-height:1.6;overflow:hidden;display:-webkit-box;
  -webkit-line-clamp:3;-webkit-box-orient:vertical}
.fixbar{margin-top:8px}
progress{width:100%;height:8px;border-radius:6px;accent-color:var(--accent)}
dialog{background:var(--surface);color:var(--text);border:1px solid var(--line-strong);
  border-radius:var(--radius);max-width:680px;width:92%;padding:16px;
  /* iOS Safari 的 vh=工具列收起後的大視口,85vh 會被網址列/快捷欄上下
     夾住(回饋 2026-07-17:範圍選單);dvh 即時反映可視高度 */
  max-height:85vh;max-height:88dvh;margin:auto;overflow-y:auto}
dialog::backdrop{background:rgba(10,10,10,.7)}
dialog h2{margin-top:0;font-family:var(--serif);font-size:18px;color:var(--text);
  text-transform:none;letter-spacing:0}
.hidden{display:none !important}
#toast{position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;
  transform:translateX(-50%);background:var(--overlay);
  border:1px solid var(--line-strong);padding:9px 18px;border-radius:var(--radius);
  font-size:14px;z-index:99;transition:opacity .3s;
  max-width:88%;text-align:center}
.qr img,.qr svg{background:#fff;border-radius:6px;padding:6px;max-width:220px}
table.stats{width:100%;font-size:12.5px;border-collapse:collapse;
  font-family:var(--mono);font-variant-numeric:tabular-nums}
table.stats td,table.stats th{padding:5px 6px;text-align:left;
  border-bottom:1px solid var(--line)}
table.stats th{color:var(--muted);font-weight:500}

/* ============ 桌面適配(2026-07-15 回饋:電腦版字太小) ============ */
@media (min-width: 900px){
  body{font-size:17.5px;line-height:1.7}
  main{max-width:920px;padding:22px 32px 40px}
  /* 導覽列移到頂部(桌面底部分頁不符慣例),置中膠囊群 */
  nav{order:-1;border-top:none;border-bottom:1px solid var(--line);
    padding-bottom:0;justify-content:center;gap:8px}
  nav button{flex:0 0 auto;padding:14px 26px 12px;font-size:14px}
  nav button.active::after{bottom:8px}
  #dock{max-width:920px;padding:10px 32px}
  .masthead .mt{font-size:26px}
  .page-title{font-size:24px}
  h2{font-size:12px}
  /* 對話:行寬鎖在可讀範圍(約 34-38 中文字),不隨版心拉滿 */
  #chat-log,#chat-empty{max-width:660px;margin-inline:auto;width:100%}
  .msg.ai{font-size:16.5px;line-height:1.85}
  .msg.user{font-size:16.5px}
  .cite .t{font-size:14.5px}
  .cite-thumb{width:64px;height:48px}
  /* 研究庫:側欄放大、標題放大、縮圖放大 */
  .vcard{padding:17px 4px;gap:18px}
  .vcard .side{width:64px;font-size:11px}
  .vcard .title{font-size:18px}
  .vcard .summary{font-size:14px;-webkit-line-clamp:2}
  .thumb,.thumb-fallback{width:104px;height:66px}
  .filters button{font-size:12px;padding:6px 14px}
  .badge{font-size:11px}
  input,textarea,select{font-size:16px}
  button.btn{font-size:15px}
  .muted{font-size:14px}
  .statgrid .stat .v{font-size:16px}
  dialog{max-width:720px;padding:22px}
  /* 滑鼠環境:hover 回饋(觸控裝置不受影響) */
  .vcard,.pick-row,.cite{transition:background .12s}
  .vcard:hover,.pick-row:hover,.cite:hover{background:var(--surface)}
  button.btn:hover{background:rgba(217,178,106,.1)}
  button.btn.ghost:hover{background:var(--surface2)}
  nav button:hover{color:var(--text)}
}
@media (min-width: 1240px){
  main{max-width:1080px}
  #dock{max-width:1080px}
  #chat-log,#chat-empty{max-width:700px}
}
</style>
</head>
<body>
<main id="main"></main>
<div id="dock"></div>

<nav>
  <button data-tab="chat" class="active"><span class="ico">💬</span>對話</button>
  <button data-tab="library"><span class="ico">🎬</span>研究庫</button>
  <button data-tab="admin"><span class="ico">⚙️</span>管理</button>
</nav>
