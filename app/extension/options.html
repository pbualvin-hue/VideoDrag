<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>存到 vidrag — 設定</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
           max-width: 460px; margin: 40px auto; padding: 0 20px; line-height: 1.5; }
    h1 { font-size: 20px; }
    label { display: block; margin: 16px 0 4px; font-weight: 600; }
    input { width: 100%; box-sizing: border-box; padding: 8px 10px; font-size: 14px;
            border: 1px solid #8886; border-radius: 6px; }
    button { margin-top: 18px; padding: 9px 18px; font-size: 14px; border: 0;
             border-radius: 6px; background: #4da3ff; color: #fff; cursor: pointer; }
    .muted { color: #8a8a8a; font-size: 13px; }
    #msg { margin-top: 12px; min-height: 20px; color: #2E7D32; font-weight: 600; }
  </style>
</head>
<body>
  <h1>存到 vidrag 設定</h1>
  <p class="muted">這兩項只需填一次,存在瀏覽器本機。token 請當密碼對待。</p>
  <label for="host">vidrag 網址</label>
  <input id="host" value="__VIDRAG_HOST__" placeholder="https://…ts.net" autocomplete="off">
  <label for="token">APP_TOKEN</label>
  <input id="token" type="password" placeholder="貼上 vidrag 管理頁的 APP_TOKEN" autocomplete="off">
  <p class="muted">在 vidrag PWA:管理 → 進階設定 → 「iPhone 分享捷徑」→ 產生安裝資訊,
    裡面有「APP_TOKEN(電腦登入用)」複製鈕。</p>
  <button id="save">儲存</button>
  <p id="msg"></p>
  <script src="options.js"></script>
</body>
</html>
